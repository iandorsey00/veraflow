name: Check
on:
  push:
    branches-ignore: ["updates"]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python examples/portable/reader.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check:version
      - run: node scripts/check-test-build.mjs
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native text conversion checks
        if: runner.os == 'macOS'
        run: clang -fobjc-arc tests/native/macos-text.m -framework AppKit -framework ApplicationServices -o /tmp/veraflow-text-test && /tmp/veraflow-text-test
      - name: Native Windows placement checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use the app's MSVC toolchain so the compiler and STL headers come from the same installation.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Could not locate the Visual Studio C++ toolchain' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $testSource = Join-Path $env:GITHUB_WORKSPACE 'tests/native/windows-window.cpp'
          $nativeSource = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/native/windows.cpp'
          Push-Location $env:RUNNER_TEMP
          cl.exe /nologo /EHsc /std:c++17 $testSource $nativeSource /Fe:veraflow-window-test.exe /link user32.lib kernel32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\veraflow-window-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run desktop:build -- --no-bundle

      - name: Build isolated Windows test installer
        if: runner.os == 'Windows' && github.ref_type == 'branch'
        env:
          VITE_TEST_BUILD: "1"
          VITE_BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          Remove-Item src-tauri/target/release/bundle/nsis -Recurse -Force -ErrorAction SilentlyContinue
          npm run desktop:build -- --bundles nsis --features test-build --config src-tauri/tauri.test.conf.json
      - name: Package Windows test download
        if: runner.os == 'Windows' && github.ref_type == 'branch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory windows-test
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one isolated test installer' }
          Copy-Item $installers[0].FullName "windows-test/VeraFlow-Test-$short-setup.exe"
          "Commit: $env:GITHUB_SHA`nSeparate test library. No public updates. Publisher unsigned." | Set-Content windows-test/BUILD.txt
          Get-FileHash "windows-test/VeraFlow-Test-$short-setup.exe" -Algorithm SHA256 | Format-List | Out-File windows-test/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.ref_type == 'branch'
        with:
          name: VeraFlow-Windows-Test-${{ github.sha }}
          path: windows-test/*
          if-no-files-found: error
          retention-days: 14
